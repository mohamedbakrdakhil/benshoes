name: boutique
description: Boutique mobile officielle de Benka Shoes.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand.png
    - assets/hero.jpg
    - assets/atelier.jpg
    - assets/products/
    - assets/fonts/OFL-Archivo.txt
    - assets/fonts/OFL-Newsreader.txt
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
